name: Mobile web app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

# Queue deployments: an older run must not overwrite a newer published app.
concurrency:
  group: mobile-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and package mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test driver
        run: python -m pip install playwright==1.62.0
      - name: Run game engine tests
        shell: bash
        run: |
          set -euo pipefail
          node --test web/tests/*.test.js 2>&1 | tee "$RUNNER_TEMP/mobile-tests.log"
      - name: Prepare production files
        shell: bash
        run: |
          set -euo pipefail
          node web/build.mjs 2>&1 | tee "$RUNNER_TEMP/mobile-build.log"
          node --input-type=module - <<'JS'
          import { writeFileSync, existsSync } from 'node:fs';
          for (const name of ['index.html', 'manifest.webmanifest', 'sw.js']) {
            if (!existsSync(`dist-mobile/${name}`)) throw new Error(`Missing production file: ${name}`);
          }
          writeFileSync('dist-mobile/build.json', JSON.stringify({commit: process.env.GITHUB_SHA}) + '\n');
          JS
      - name: Test touch controls, phone layouts and offline play
        shell: bash
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python web/test_browser.py 2>&1 | tee "$RUNNER_TEMP/mobile-browser.log"
      - name: Upload downloadable website files
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web
          path: dist-mobile/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-mobile/
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-build-diagnostics
          path: |
            ${{ runner.temp }}/mobile-tests.log
            ${{ runner.temp }}/mobile-build.log
            ${{ runner.temp }}/mobile-browser.log
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy mobile app
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check and enable Pages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const params = {owner: context.repo.owner, repo: context.repo.repo};
            const report = {commit: context.sha};
            try {
              const repo = await github.request('GET /repos/{owner}/{repo}', params);
              report.visibility = repo.data.private ? 'private' : 'public';
              let pages;
              try {
                pages = await github.request('GET /repos/{owner}/{repo}/pages', params);
              } catch (error) {
                if (error.status !== 404) throw error;
                pages = await github.request('POST /repos/{owner}/{repo}/pages', {...params, build_type: 'workflow'});
                report.created = true;
              }
              report.build_type = pages.data.build_type;
              report.url = pages.data.html_url;
              if (pages.data.build_type && pages.data.build_type !== 'workflow') {
                throw new Error('An existing Pages site uses another publishing source. Select GitHub Actions in repository Settings > Pages before deploying this app.');
              }
              report.ok = true;
            } catch (error) {
              report.ok = false;
              report.status = error.status || null;
              report.error = error.message;
              core.setFailed(error.message);
            } finally {
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'mobile-pages-configuration.json'), JSON.stringify(report, null, 2));
            }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish mobile app
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed version and PWA resources
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs';
          const base = process.env.PAGE_URL.replace(/\/?$/, '/');
          const read = url => fetch(url, {signal: AbortSignal.timeout(10000)});
          const report = {commit: process.env.GITHUB_SHA, url: base, verified: false};
          let lastError;
          for (let attempt = 0; attempt < 18; attempt++) {
            try {
              const marker = await read(new URL(`build.json?commit=${process.env.GITHUB_SHA}`, base));
              if (!marker.ok) throw new Error(`Build marker HTTP ${marker.status}`);
              if ((await marker.json()).commit !== process.env.GITHUB_SHA) throw new Error('Published commit does not match this run');
              const index = await read(new URL(`index.html?commit=${process.env.GITHUB_SHA}`, base));
              if (!index.ok || !(await index.text()).toLowerCase().includes('<html')) throw new Error('Application HTML is unavailable');
              const manifest = await read(new URL('manifest.webmanifest', base));
              if (!manifest.ok) throw new Error(`Manifest HTTP ${manifest.status}`);
              const data = await manifest.json();
              if (!data.start_url || !data.icons?.length) throw new Error('PWA manifest lacks launch information');
              const worker = await read(new URL('sw.js', base));
              if (!worker.ok || !(await worker.text()).includes('install')) throw new Error('Service worker is unavailable');
              report.verified = true;
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 17) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          if (!report.verified) report.error = lastError?.message || 'Deployment could not be verified';
          writeFileSync(`${process.env.RUNNER_TEMP}/mobile-pages-readiness.json`, JSON.stringify(report, null, 2));
          if (!report.verified) throw new Error(report.error);
          JS
      - name: Preserve deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-deploy-diagnostics
          path: |
            ${{ runner.temp }}/mobile-pages-configuration.json
            ${{ runner.temp }}/mobile-pages-readiness.json
          if-no-files-found: ignore
          retention-days: 7

  receipt:
    name: Record deployment result
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read build diagnostics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mobile-build-diagnostics
          path: mobile-diagnostics
      - name: Read deployment diagnostics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mobile-deploy-diagnostics
          path: mobile-diagnostics
      # Git receipts let the onboarding agent verify a deployment even when
      # its cloud network cannot access the GitHub REST API. No forced updates.
      - name: Record bounded deployment receipt
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          success = os.environ['BUILD_RESULT'] == 'success' and os.environ['DEPLOY_RESULT'] == 'success'
          report = {
              'verified': success,
              'commit': os.environ['GITHUB_SHA'],
              'url': os.environ['PAGE_URL'],
              'run_url': os.environ['RUN_URL'],
              'build_result': os.environ['BUILD_RESULT'],
              'deploy_result': os.environ['DEPLOY_RESULT'],
          }
          if not success:
              # Only these known files; never inspect environment or credentials.
              diagnostics = {}
              for name in ('mobile-tests.log', 'mobile-build.log', 'mobile-browser.log',
                           'mobile-pages-configuration.json', 'mobile-pages-readiness.json'):
                  path = Path('mobile-diagnostics') / name
                  if path.is_file():
                      with path.open('rb') as stream:
                          stream.seek(max(0, path.stat().st_size - 12000))
                          text = stream.read(12000).decode('utf-8', errors='replace')
                      diagnostics[name] = '\n'.join(text.splitlines()[-60:])[-10000:]
              report['diagnostics'] = diagnostics
          Path('mobile-deployment-result.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          Path('mobile-receipt-tag.txt').write_text(
              ('mobile-deploy/' if success else 'mobile-deploy-error/') + os.environ['GITHUB_SHA'][:12], encoding='utf-8')
          PYTHON
          receipt_tag="$(cat mobile-receipt-tag.txt)"
          existing="$(git ls-remote --tags origin "refs/tags/$receipt_tag")"
          if [ -n "$existing" ]; then
            echo 'An immutable receipt already exists; leaving it unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$receipt_tag" "$GITHUB_SHA" -F mobile-deployment-result.json
          git push origin "refs/tags/$receipt_tag"
